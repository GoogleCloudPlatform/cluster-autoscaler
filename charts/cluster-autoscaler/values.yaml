# Override the name of the chart, preserving release name prefix
nameOverride: ""
# Fully override the name of the chart, will not add a release name prefix
fullnameOverride: ""
# Labels to add to each object of the chart.
additionalLabels: {}

# ==============================================================================
# CLUSTER IDENTITY
# ==============================================================================

cluster:
  name: ""
  hash: ""
  projectNumber: ""
  location: ""
  regional: true

# ==============================================================================
# CLOUD CONFIG
# ==============================================================================

# cloudConfig is the content of the gce.conf file. If set, it will be mounted
# to /etc/gce.conf and provided to the autoscaler.
cloudConfig: ""

# ==============================================================================
# AUTOSCALING PROFILES DEFINITION
# ==============================================================================

autoscalingProfiles:
  # Default Balanced Profile
  default:
    max-scale-down-parallelism: "100"
    max-drain-parallelism: "100"
    scale-down-delay-after-delete: "10s"
    daemonset-eviction-for-empty-nodes: "true"

  # Optimize Utilization Profile (Cost-optimized, aggressive scale-down)
  optimizeUtilization:
    max-drain-parallelism: "100"
    max-scale-down-parallelism: "100"
    scale-down-delay-after-delete: "5s"
    scale-down-delay-after-failure: "5s"
    scale-down-unneeded-time: "1m"
    scale-down-unready-time: "5m"
    scale-down-utilization-threshold: "0.85"
    scale-down-gpu-utilization-threshold: "0.85"
    scan-interval: "5s"
    unremovable-node-recheck-timeout: "20s"

# ==============================================================================
# AUTOSCALER CONFIG
# ==============================================================================

config:
  # ConfigMap name to use as envFrom.
  envFromConfigMap: ""
  # Secret name to use as envFrom.
  envFromSecret: ""
  # Additional container environment variables.
  extraEnv: {}
  # Additional environment variables from ConfigMaps.
  extraEnvFromConfigMaps: {}
  # Additional environment variables from Secrets.
  extraEnvFromSecrets: {}
  # Additional custom arguments passed directly as-is into image arguments without any templating or processing.
  extraArguments: []
  # Autoscaling profile to use.
  autoscalingProfile: default
  # Flags to pass to the autoscaler.
  flags:
    # ==========================================================================
    # Core
    # ==========================================================================
    v: "4"
    address: ":8085"
    logtostderr: "true"
    cloud-provider: "gke"
    system-namespaces: "kube-system,gke-gmp-system,gmp-system,gke-managed-cim,gke-managed-volumepopulator,gke-managed-checkpointing,gkebackup,gke-managed-lustrecsi,gke-managed-otel,gke-managed-mldiagnostics,gke-managed-networking-dra-driver,gke-managed-pod-snapshots,gke-managed-slurm,gke-managed-ambient"

    # ==========================================================================
    # Limits
    # ==========================================================================
    cores-total: "0:12800000"
    memory-total: "0:256000000"
    max-total-unready-percentage: "101"

    # ==========================================================================
    # Performance (Throughput/Concurrency)
    # ==========================================================================
    kube-client-qps: "100"
    kube-client-burst: "100"
    parallel-scale-up: "true"
    fastpath-binpacking-enabled: "true"
    frequent-loops-enabled: "true"
    async-node-groups: "true"
    node-info-cache-expire-time: "10m"
    node-delete-delay-after-taint: "1s"
    cp-max-parallel-ops: "90"
    cp-max-queued-ops: "200"
    max-nodes-per-scaleup: "1000"
    max-nodegroup-binpacking-duration: "7s"
    pod-injection-limit: "5000"

    # ==========================================================================
    # Subsystems & Capabilities
    # ==========================================================================
    enable-proactive-scaleup: "true"
    enable-node-pool-updates: "true"
    enable-compact-placement: "true"
    enable-provisioning-requests: "true"
    enable-graceful-degradation: "true"
    enable-dynamic-resource-allocation: "true"
    capacity-buffer-controller-enabled: "true"
    capacity-buffer-pod-injection-enabled: "true"
    capacity-quotas-enabled: "true"
    machine-config-enabled: "true"
    dynamic-node-delete-delay-after-taint-enabled: "true"
    force-delete-failed-nodes: "true"
    force-delete-unregistered-nodes: "true"
    machine-serenity-labels-enabled: "true"
    enable-reservation-blocks: "true"
    enable-reservation-match: "true"
    enable-consumable-reservations-puller: "true"

    # ==========================================================================
    # Autoprovisioning (NAP/CCC)
    # ==========================================================================
    ccc-node-autoprovisioning-enabled: "true"
    max-autoprovisioned-node-group-count: "999999"
    nap-default-machine-type-family: "e2"
    enable-tpu-autoprovisioning: "true"
    enable-user-any-zone-selection: "true"
    enable-compute-class-min-capacity: "true"
    enable-zone-types: "true"

    # ==========================================================================
    # Scheduling
    # ==========================================================================
    scale-up-from-zero: "true"
    expander: "edp-filter,snowflake,mppn-filter,fleet-efficiency,gke-price"
    bypassed-scheduler-names: "default-scheduler,gke.io/default-scheduler,gke.io/optimize-utilization-scheduler,gke.io/high-throughput-scheduler,gke.io/first-fit"
    balance-similar-node-groups: "true"
    pvm-unfitness-penalty-enabled: "true"
    expendable-pods-priority-cutoff: "-10"
    ignore-daemonsets-utilization: "true"
    ignore-mirror-pods-utilization: "true"
    skip-nodes-with-local-storage: "false"
    startup-taint: "readiness.k8s.io/gke-node-custom-script"
    scale-down-delay-after-add: "0m"
    drain-priority-config: "0:3600,1000000000:600"

    # ==========================================================================
    # Defragmentation
    # ==========================================================================
    enable-defrag: "true"
    defrag-candidate-node-limit: "20"
    defrag-plugins: "daemonset,recycling,high-priority-migration,ek-consolidation,failed-nodes"

    # ==========================================================================
    # Metrics
    # ==========================================================================
    debugging-snapshot-enabled: "true"
    node-removal-latency-tracking-enabled: "true"
    max-node-skip-eval-time-tracker-enabled: "true"
    enable-pending-pods-per-ccc-metric: "true"
    scaleup-per-ccc-metrics-enabled: "true"
    enable-pending-pods-metric: "true"
    metrics-per-ccc-enabled: "true"

# ==============================================================================
# WORKLOAD & DEPLOYMENT SPEC
# ==============================================================================

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

# revisionHistoryLimit -- The number of old ReplicaSets to retain to allow rollback.
revisionHistoryLimit: 10

# Server config for the autoscaler application.
server:
  # server.port -- Port the autoscaler server listens on.
  port: 8085
  # server.portName -- Name for the server port in container spec.
  portName: http

deployment:
  # deployment.annotations -- Annotations to add to the Deployment object.
  annotations: {}
  # deployment.selector -- Labels for Deployment `spec.selector.matchLabels`.
  selector: {}

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: registry.k8s.io/autoscaling/cluster-autoscaler
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
  pullSecrets: []

# dnsConfig -- Pod's DNS Config (https://kubernetes.io/docs/concepts/services-networking/dns-pod-service/#pod-dns-config)
dnsConfig: {}
  # nameservers:
  #   - 1.2.3.4
  # searches:
  #   - ns1.svc.cluster-domain.example
  #   - my.dns.search.suffix
  # options:
  #   - name: ndots
  #     value: "2"
  #   - name: edns0

# dnsPolicy -- Defaults to `ClusterFirst`. Valid values: `ClusterFirstWithHostNet`, `ClusterFirst`, `Default`, or `None`.
dnsPolicy: ClusterFirst

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

# Security Context for the autoscaler pod.
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault
  runAsUser: 2049
  runAsGroup: 2049

# Security Context for the autoscaler container.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources: {}
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# Liveness probe for the autoscaler decisions. Ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
livenessProbe:
  httpGet:
    path: /health-check
    port: 8085
  initialDelaySeconds: 600
  periodSeconds: 60

# Readiness probe for the autoscaler decisions. Ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
readinessProbe: {}

# Additional volumes on the output Deployment definition.
volumes: []
  # - name: foo
  #   secret:
  #     secretName: mysecret
  #     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
  # - name: foo
  #   mountPath: "/etc/foo"
  #   readOnly: true

# Node labels for pod assignment. Ref: https://kubernetes.io/docs/user-guide/node-selection/.
nodeSelector: {}

# List of node taints to tolerate. Ref: https://kubernetes.io/docs/concepts/configuration/taint-and-toleration/
tolerations: []

# Affinity for pod assignment. Ref: https://kubernetes.io/docs/concepts/configuration/assign-pod-node/#affinity-and-anti-affinity
affinity: {}

# You can use topology spread constraints to control how Pods are spread across your cluster among failure-domains such as regions, zones, nodes, and other user-defined topology domains. (requires Kubernetes >= 1.19).
topologySpreadConstraints: []
  # - maxSkew: 1
  #   topologyKey: topology.kubernetes.io/zone
  #   whenUnsatisfiable: DoNotSchedule
  #   labelSelector:
  #     matchLabels:
  #       app.kubernetes.io/instance: cluster-autoscaler

# Deployment update strategy. Ref: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#strategy
updateStrategy: {}
  # rollingUpdate:
  #   maxSurge: 1
  #   maxUnavailable: 0
  # type: RollingUpdate

# Priority Class for the autoscaler deployment. Ref: https://kubernetes.io/docs/concepts/scheduling-eviction/pod-priority-preemption/
priorityClassName: ""

# podDisruptionBudget -- Pod disruption budget.
podDisruptionBudget:
  # podDisruptionBudget.enabled -- If true, creates a PodDisruptionBudget.
  enabled: true
  # podDisruptionBudget.annotations -- Annotations to add to the PodDisruptionBudget.
  annotations: {}
  # podDisruptionBudget.selector -- Override labels for PodDisruptionBudget `spec.selector.matchLabels`.
  selector: {}
  maxUnavailable: 1
  # minAvailable: 2

# initContainers -- Any additional init containers.
initContainers: []

# hostNetwork -- Whether to expose network interfaces of the host machine to pods.
#
# Warning: enabling hostNetwork would likely be problematic due to inability
# to contact GKE metadata server from autoscler pods: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/workload-identity#restrictions
#
# Alternative in case when it's required to enable host networking: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/workload-identity#alternatives_to
hostNetwork: false

# ==============================================================================
# KUBERNETES AUXILIARY RESOURCES
# ==============================================================================

service:
  # service.create -- If `true`, a Service will be created.
  create: true
  # service.annotations -- Annotations to add to service
  annotations: {}
  # service.labels -- Labels to add to service
  labels: {}
  # service.externalIPs -- List of IP addresses at which the service is available. Ref: https://kubernetes.io/docs/concepts/services-networking/service/#external-ips.
  externalIPs: []
  # service.selector -- Override labels for Service `spec.selector`.
  selector: {}
  # service.clusterIP -- IP address to assign to service
  clusterIP: ""
  # service.loadBalancerSourceRanges -- List of IP CIDRs allowed access to load balancer (if supported).
  loadBalancerSourceRanges: []
  # service.port -- Service port to expose.
  port: 8085
  # service.type -- Type of service to create.
  type: ClusterIP


# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created.
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account.
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template.
  name: ""
  # GCP Workload Identity to bind this service account to.
  # If provided, an annotation iam.gke.io/gcp-service-account will be added to the ServiceAccount.
  gcpWorkloadIdentity: ""


rbac:
  # rbac.create -- If `true`, create and use RBAC resources.
  create: true
  # rbac.annotations -- Additional annotations to add to RBAC resources (Role/RoleBinding/ClusterRole/ClusterRoleBinding).
  annotations: {}
  # rbac.additionalRules -- Additional rules for role/clusterrole
  additionalRules: []

## Settings for the Prometheus Operator
serviceMonitor:
  # serviceMonitor.enabled -- If true, creates a Prometheus Operator ServiceMonitor.
  enabled: false
  # serviceMonitor.interval -- Interval that Prometheus scrapes Cluster Autoscaler metrics.
  interval: 10s
  # serviceMonitor.namespace -- Namespace to deploy the ServiceMonitor into. If not set, the release namespace is used.
  namespace: ""
  ## [Prometheus Selector Label](https://github.com/helm/charts/tree/master/stable/prometheus-operator#prometheus-operator-1)
  ## [Kube Prometheus Selector Label](https://github.com/helm/charts/tree/master/stable/prometheus-operator#exporters)
  # serviceMonitor.selector -- Default to kube-prometheus install (CoreOS recommended), but should be set according to Prometheus install.
  selector:
    release: prometheus-operator
  # serviceMonitor.path -- The path to scrape for metrics; autoscaler exposes `/metrics` (this is standard)
  path: /metrics
  # serviceMonitor.annotations -- Annotations to add to service monitor
  annotations: {}
  ## [RelabelConfig](https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/api.md#monitoring.coreos.com/v1.RelabelConfig)
  # serviceMonitor.relabelings -- RelabelConfigs to apply to metrics before scraping.
  relabelings: []
  ## [RelabelConfig](https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/api.md#monitoring.coreos.com/v1.RelabelConfig)
  # serviceMonitor.metricRelabelings -- MetricRelabelConfigs to apply to samples before ingestion.
  metricRelabelings: []

# ==============================================================================
