apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cluster-autoscaler.fullname" . }}
  labels:
    {{- include "cluster-autoscaler.labels" . | nindent 4 }}
  {{- with .Values.deployment.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- if .Values.revisionHistoryLimit }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  {{- end }}
  {{- with .Values.updateStrategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- if .Values.deployment.selector }}
      {{- toYaml .Values.deployment.selector | nindent 6 }}
      {{- else }}
      {{- include "cluster-autoscaler.selectorLabels" . | nindent 6 }}
      {{- end }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "cluster-autoscaler.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "cluster-autoscaler.serviceAccountName" . }}
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName | quote }}
      {{- end }}
      {{- with .Values.dnsConfig }}
      dnsConfig:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.dnsPolicy }}
      dnsPolicy: {{ .Values.dnsPolicy | quote }}
      {{- end }}
      {{- if hasKey .Values "hostNetwork" }}
      hostNetwork: {{ .Values.hostNetwork }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.initContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /cluster-autoscaler
          args:
            {{- $profile := index .Values.autoscalingProfiles .Values.config.autoscalingProfile | default dict }}
            {{- $flags := merge (deepCopy .Values.config.flags) $profile }}
            {{- if .Values.cloudConfig }}
            {{- $_ := set $flags "cloud-config" "/etc/gce.conf" }}
            {{- end }}
            {{- if .Values.cluster.name }}
            {{- $_ := set $flags "cluster-name" .Values.cluster.name }}
            {{- end }}
            {{- if .Values.cluster.hash }}
            {{- $_ := set $flags "cluster-hash" .Values.cluster.hash }}
            {{- end }}
            {{- if .Values.cluster.projectNumber }}
            {{- $_ := set $flags "project-number" .Values.cluster.projectNumber }}
            {{- end }}
            {{- if .Values.cluster.location }}
            {{- $_ := set $flags "location" .Values.cluster.location }}
            {{- end }}
            {{- if hasKey .Values.cluster "regional" }}
            {{- $_ := set $flags "regional" (.Values.cluster.regional | toString) }}
            {{- end }}
            {{- range $key, $value := $flags }}
            {{- if kindIs "slice" $value }}
            {{- range $val := $value }}
            - --{{ $key }}={{ $val }}
            {{- end }}
            {{- else }}
            - --{{ $key }}={{ $value }}
            {{- end }}
            {{- end }}
            {{- range .Values.config.extraArguments }}
            - {{ . }}
            {{- end }}
          {{- if or .Values.config.envFromConfigMap .Values.config.envFromSecret .Values.config.extraEnvFromConfigMaps .Values.config.extraEnvFromSecrets }}
          envFrom:
            {{- if .Values.config.envFromConfigMap }}
            - configMapRef:
                name: {{ .Values.config.envFromConfigMap }}
            {{- end }}
            {{- if .Values.config.envFromSecret }}
            - secretRef:
                name: {{ .Values.config.envFromSecret }}
            {{- end }}
            {{- range $key, $val := .Values.config.extraEnvFromConfigMaps }}
            - configMapRef:
                name: {{ $val }}
            {{- end }}
            {{- range $key, $val := .Values.config.extraEnvFromSecrets }}
            - secretRef:
                name: {{ $val }}
            {{- end }}
          {{- end }}
          env:
            - name: CLUSTERAUTOSCALER_VERSION
              value: {{ .Chart.AppVersion | quote }}
            {{- range $key, $val := .Values.config.extraEnv }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
          ports:
            - name: {{ .Values.server.portName }}
              containerPort: {{ .Values.server.port }}
              protocol: TCP
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or .Values.cloudConfig .Values.volumeMounts }}
          volumeMounts:
            {{- if .Values.cloudConfig }}
            - name: cloud-config
              mountPath: /etc/gce.conf
              subPath: gce.conf
              readOnly: true
            {{- end }}
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
      {{- if or .Values.cloudConfig .Values.volumes }}
      volumes:
        {{- if .Values.cloudConfig }}
        - name: cloud-config
          configMap:
            name: {{ include "cluster-autoscaler.fullname" . }}-cloud-config
        {{- end }}
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
