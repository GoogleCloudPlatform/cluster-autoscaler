suite: Test PodDisruptionBudget template
templates:
  - pdb.yaml
tests:
  - it: should render PDB by default with maxUnavailable=1
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: PodDisruptionBudget
      - isAPIVersion:
          of: policy/v1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-cluster-autoscaler
      - equal:
          path: spec.maxUnavailable
          value: 1
      - notExists:
          path: spec.minAvailable
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/name"]
          value: cluster-autoscaler
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/instance"]
          value: RELEASE-NAME

  - it: should not render PDB when disabled
    set:
      podDisruptionBudget.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should render PDB with minAvailable
    set:
      podDisruptionBudget.maxUnavailable: null
      podDisruptionBudget.minAvailable: 2
    asserts:
      - equal:
          path: spec.minAvailable
          value: 2
      - notExists:
          path: spec.maxUnavailable

  - it: should fail when both minAvailable and maxUnavailable are set
    set:
      podDisruptionBudget.minAvailable: 1
      podDisruptionBudget.maxUnavailable: 1
    asserts:
      - failedTemplate:
          errorMessage: "Only one of podDisruptionBudget.minAvailable or podDisruptionBudget.maxUnavailable should be set."

  - it: should set custom annotations and selector
    set:
      podDisruptionBudget.annotations:
        custom.annotation/key: test-val
      podDisruptionBudget.selector:
        custom.label/key: custom-selector
    asserts:
      - equal:
          path: metadata.annotations["custom.annotation/key"]
          value: test-val
      - equal:
          path: spec.selector.matchLabels["custom.label/key"]
          value: custom-selector
