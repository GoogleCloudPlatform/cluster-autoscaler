suite: Test Experiments ConfigMap template
templates:
  - experiments-configmap.yaml
tests:
  - it: should render ConfigMap with default experiments in experiments.json
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ConfigMap
      - isAPIVersion:
          of: v1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-cluster-autoscaler-experiments
      - isNotEmpty:
          path: data["experiments.json"]

  - it: should not render data when config.experiments is null
    set:
      config.experiments: null
    asserts:
      - notExists:
          path: data

  - it: should support fullnameOverride
    set:
      fullnameOverride: custom-ca
    asserts:
      - equal:
          path: metadata.name
          value: custom-ca-experiments

  - it: should support nameOverride
    set:
      nameOverride: my-autoscaler
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-my-autoscaler-experiments
