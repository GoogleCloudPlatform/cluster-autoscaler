suite: Test ClusterRoleBinding template
templates:
  - clusterrolebinding.yaml
tests:
  - it: should render ClusterRoleBinding by default
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ClusterRoleBinding
      - isAPIVersion:
          of: rbac.authorization.k8s.io/v1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-cluster-autoscaler
      - equal:
          path: roleRef.kind
          value: ClusterRole
      - equal:
          path: roleRef.name
          value: RELEASE-NAME-cluster-autoscaler
      - equal:
          path: roleRef.apiGroup
          value: rbac.authorization.k8s.io
      - equal:
          path: subjects[0].kind
          value: ServiceAccount
      - equal:
          path: subjects[0].name
          value: RELEASE-NAME-cluster-autoscaler
      - equal:
          path: subjects[0].namespace
          value: NAMESPACE

  - it: should not render ClusterRoleBinding when rbac.create is false
    set:
      rbac.create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should bind to custom ServiceAccount name
    set:
      serviceAccount.name: custom-autoscaler-sa
    asserts:
      - equal:
          path: subjects[0].name
          value: custom-autoscaler-sa

  - it: should support custom RBAC annotations
    set:
      rbac.annotations:
        rbac.authorization.k8s.io/autoupdate: "false"
    asserts:
      - equal:
          path: metadata.annotations["rbac.authorization.k8s.io/autoupdate"]
          value: "false"
