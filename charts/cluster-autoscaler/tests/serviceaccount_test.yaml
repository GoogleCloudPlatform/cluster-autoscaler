suite: Test ServiceAccount template
templates:
  - serviceaccount.yaml
tests:
  - it: should render ServiceAccount by default
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ServiceAccount
      - isAPIVersion:
          of: v1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-cluster-autoscaler
      - equal:
          path: automountServiceAccountToken
          value: true
      - notExists:
          path: metadata.annotations

  - it: should not render ServiceAccount when disabled
    set:
      serviceAccount.create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should render ServiceAccount with custom name and automount disabled
    set:
      serviceAccount.name: my-custom-sa
      serviceAccount.automount: false
    asserts:
      - equal:
          path: metadata.name
          value: my-custom-sa
      - equal:
          path: automountServiceAccountToken
          value: false

  - it: should add GCP Workload Identity annotation and custom annotations
    set:
      serviceAccount.gcpWorkloadIdentity: ca-sa@my-gcp-project.iam.gserviceaccount.com
      serviceAccount.annotations:
        custom-annotation: example-value
    asserts:
      - equal:
          path: metadata.annotations["iam.gke.io/gcp-service-account"]
          value: ca-sa@my-gcp-project.iam.gserviceaccount.com
      - equal:
          path: metadata.annotations["custom-annotation"]
          value: example-value
