suite: Test ClusterRole template
templates:
  - clusterrole.yaml
tests:
  - it: should render ClusterRole by default
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ClusterRole
      - isAPIVersion:
          of: rbac.authorization.k8s.io/v1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-cluster-autoscaler
      - contains:
          path: rules
          content:
            apiGroups:
              - ""
            resources:
              - nodes
            verbs:
              - get
              - list
              - watch
              - update
              - patch

  - it: should not render ClusterRole when rbac.create is false
    set:
      rbac.create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should support custom annotations and additionalRules
    set:
      rbac.annotations:
        rbac.authorization.k8s.io/autoupdate: "false"
      rbac.additionalRules:
        - apiGroups:
            - custom.autoscaling.k8s.io
          resources:
            - customresources
          verbs:
            - get
            - list
            - watch
    asserts:
      - equal:
          path: metadata.annotations["rbac.authorization.k8s.io/autoupdate"]
          value: "false"
      - contains:
          path: rules
          content:
            apiGroups:
              - custom.autoscaling.k8s.io
            resources:
              - customresources
            verbs:
              - get
              - list
              - watch
